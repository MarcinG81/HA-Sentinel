name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Rebuild the panel and require it to match the committed bundle
        working-directory: frontend-src
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../custom_components/ha_sentinel/frontend/
      - name: Version in manifest must match the tag
        run: |
          test "$(jq -r .version custom_components/ha_sentinel/manifest.json)" = "${GITHUB_REF_NAME#v}"
      - name: Package (HACS zip release), checksum and SBOM
        run: |
          cd custom_components/ha_sentinel
          zip -r -X ../../ha_sentinel.zip . -x "__pycache__/*" "*.pyc"
          cd ../..
          sha256sum ha_sentinel.zip > ha_sentinel.zip.sha256
          (cd frontend-src && npm sbom --sbom-format cyclonedx --omit dev) > sbom.cdx.json
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ha_sentinel.zip ha_sentinel.zip.sha256 sbom.cdx.json
