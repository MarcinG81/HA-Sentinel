name: Wiki

# Publishes docs/wiki/ to the GitHub wiki. The wiki repository exists only after its
# first page was created once in the GitHub web UI.
on:
  push:
    branches: [main]
    paths: ["docs/wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync docs/wiki to the wiki repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
          else
            git commit -m "Sync wiki from ${GITHUB_SHA::7}"
            git push
          fi
