name: Validate

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component ruff home-assistant-frontend pytest-cov
      - run: ruff check .
      - run: pytest -q --cov=custom_components/ha_sentinel --cov-branch --cov-report=term
      - name: Dependency audit of the frontend toolchain
        working-directory: frontend-src
        run: npm ci && npm audit --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Committed bundle must match the sources
        run: git diff --exit-code -- ../custom_components/ha_sentinel/frontend/
      - name: Accessibility audit (axe-core, WCAG 2.1 AA) and detector self-check
        run: |
          npm run a11y -- "$(which google-chrome)"
          ! A11Y_SELF_CHECK=1 npm run a11y -- "$(which google-chrome)"
