name: Validate

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Newest qualified line (unpinned harness = current HA release).
          - ha: current
            harness: pytest-homeassistant-custom-component
            frontend: home-assistant-frontend
          # Lowest supported version (hacs.json "homeassistant"); keep in sync.
          - ha: "2026.5.1"
            harness: pytest-homeassistant-custom-component==0.13.330
            frontend: home-assistant-frontend==20260429.3
    name: tests (HA ${{ matrix.ha }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "${{ matrix.harness }}" "${{ matrix.frontend }}" ruff pytest-cov
      - run: ruff check .
      - run: pytest -q --cov=custom_components/ha_sentinel --cov-branch --cov-report=term --cov-fail-under=90
      - name: Dependency audit of the frontend toolchain
        if: matrix.ha == 'current'
        working-directory: frontend-src
        run: npm ci && npm audit --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Committed bundle must match the sources
        run: git diff --exit-code -- ../custom_components/ha_sentinel/frontend/
      - name: Accessibility audit (axe-core, WCAG 2.1 AA) and detector self-check
        run: |
          npm run a11y -- "$(which google-chrome)"
          ! A11Y_SELF_CHECK=1 npm run a11y -- "$(which google-chrome)"
