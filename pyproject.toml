[project]
name = "ha-sentinel"
version = "0.2.0"
requires-python = ">=3.14"
license = "GPL-3.0-only"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["perf: load and budget tests (run with -m perf)"]
addopts = "-m 'not perf'"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
